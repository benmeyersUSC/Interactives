<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entropy sculptor</title>
<style>
:root{--paper:#F3F5F8;--panel:#FFFFFF;--ink:#16202E;--muted:#5B6778;--faint:#8A95A5;--line:#DCE2EA;--grid:#E9EDF2;--axis:#C3CBD6;--curve:#4B3FD1;--curve-fill:rgba(75,63,209,.13);--ref:#A5AEBB;--mark:#C2780E;--neg:#C23B5A;--neg-fill:rgba(194,59,90,.16);--r:10px}
@media (prefers-color-scheme:dark){:root{--paper:#0F141C;--panel:#161D28;--ink:#E6EAF0;--muted:#A3AEBE;--faint:#7C889A;--line:#263041;--grid:#1D2531;--axis:#344052;--curve:#8C82FF;--curve-fill:rgba(140,130,255,.17);--ref:#566376;--mark:#E3A03A;--neg:#F0708C;--neg-fill:rgba(240,112,140,.18)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-size:26px;font-weight:650;letter-spacing:-.015em;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr);gap:18px}.rail{display:contents}.readout{order:0}.stats{order:1}main{order:2}.controls{order:3}.notes{order:4}}
.readout .h{font-size:46px;font-weight:650;line-height:1;letter-spacing:-.025em}
.readout .h small{font-size:16px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.readout .sub{color:var(--muted);font-size:13px;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--panel);padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:600}
.controls{display:flex;flex-direction:column;gap:12px}
.ctl{display:grid;grid-template-columns:84px 1fr 48px;align-items:center;gap:10px;font-size:14px}
.ctl label{color:var(--muted)}
.ctl output{text-align:right;font-weight:600}
input[type=range]{width:100%;accent-color:var(--curve)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--axis)}
:focus-visible{outline:2px solid var(--curve);outline-offset:2px}
.plot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;margin-bottom:14px}
.plot .t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--muted);margin:0 2px 6px}
.plot .t b{color:var(--ink);font-weight:600;margin-right:4px}
.cv{position:relative;width:100%}
.cv canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.drag canvas{touch-action:none;cursor:crosshair}
.hint{font-size:12px;color:var(--faint)}
#read{white-space:pre}
.notes{font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;margin:0}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Entropy sculptor</h1><p>Drag the distribution and watch the bits move.</p></div>
  <div class="seg" role="group" aria-label="Mode">
    <button id="modeC" aria-pressed="true">Continuous</button>
    <button id="modeD" aria-pressed="false">Discrete</button>
  </div>
</header>
<div class="layout">
  <aside class="rail">
    <div class="readout" aria-live="polite">
      <div class="h"><span id="hVal">0.000</span><small>bits</small></div>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k" id="k1"></div><div class="v" id="v1"></div></div>
      <div class="stat"><div class="k" id="k2"></div><div class="v" id="v2"></div></div>
      <div class="stat"><div class="k" id="k3"></div><div class="v" id="v3"></div></div>
      <div class="stat"><div class="k" id="k4"></div><div class="v" id="v4"></div></div>
    </div>

    <div class="controls" id="ctlC">
      <div class="ctl"><label for="cSig">σ</label><input type="range" id="cSig" min="0.3" max="2.5" step="0.05" value="1"><output id="cSigO">1.00</output></div>
      <div class="ctl"><label for="cAlp">Skew α</label><input type="range" id="cAlp" min="-10" max="10" step="0.5" value="0"><output id="cAlpO">0.0</output></div>
      <div class="ctl"><label for="cBw">Brush</label><input type="range" id="cBw" min="0.05" max="2" step="0.05" value="0.4"><output id="cBwO">0.40</output></div>
      <div class="btns"><button class="btn" id="cClear">Clear sculpting</button><button class="btn" id="cFit">Refit scale</button></div>
    </div>

    <div class="controls hidden" id="ctlD">
      <div class="ctl"><label for="dN">Outcomes n</label><input type="range" id="dN" min="2" max="64" step="1" value="12"><output id="dNO">12</output></div>
      <div class="ctl"><label for="dSig">σ (bins)</label><input type="range" id="dSig" min="0.3" max="16" step="0.1" value="2.5"><output id="dSigO">2.5</output></div>
      <div class="ctl"><label for="dAlp">Skew α</label><input type="range" id="dAlp" min="-10" max="10" step="0.5" value="0"><output id="dAlpO">0.0</output></div>
      <div class="btns">
        <button class="btn" data-kind="bell">Bell</button>
        <button class="btn" data-kind="uniform">Uniform</button>
        <button class="btn" data-kind="geometric">Geometric</button>
        <button class="btn" data-kind="random">Random</button>
        <button class="btn" id="dFit">Refit scale</button>
      </div>
    </div>

    <p class="notes" id="notes"></p>
  </aside>

  <main>
    <section class="plot">
      <div class="t"><span><b>Density</b><span id="t1">p(x), drag to sculpt</span></span><span class="hint" id="read"></span></div>
      <div class="cv drag" style="height:270px"><canvas id="c1" role="img" aria-label="Distribution you can drag to reshape"></canvas></div>
    </section>
    <section class="plot">
      <div class="t"><span><b>Information</b>I = −log₂ p, also draggable</span><span class="hint">dashed line is H</span></div>
      <div class="cv drag" style="height:215px"><canvas id="c2" role="img" aria-label="Surprisal with the entropy level marked"></canvas></div>
    </section>
    <section class="plot">
      <div class="t"><span><b>Entropy density</b>p · I</span><span class="hint">its total area is H</span></div>
      <div class="cv" style="height:150px"><canvas id="c3" role="img" aria-label="Contribution of each region to the entropy"></canvas></div>
    </section>
  </main>
</div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let COL = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);
  ["curve","curve-fill","ref","mark","neg","neg-fill","grid","axis","faint","ink","panel"].forEach(k => COL[k] = s.getPropertyValue("--" + k).trim());
}
readColors();

function erf(x) {
  const t = 1 / (1 + 0.3275911 * Math.abs(x));
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return x >= 0 ? y : -y;
}
function snPdf(x, s, a) {
  const d = a / Math.sqrt(1 + a * a);
  const w = s / Math.sqrt(1 - 2 * d * d / Math.PI);
  const xi = -w * d * Math.sqrt(2 / Math.PI);
  const z = (x - xi) / w;
  return (2 / w) * Math.exp(-z * z / 2) / 2.5066282746310002 * 0.5 * (1 + erf(a * z / Math.SQRT2));
}

const PL = 40, PR = 10, PT = 8, PB = 22;
function prep(cv) {
  const r = window.devicePixelRatio || 1, box = cv.parentElement;
  const W = box.clientWidth, H = box.clientHeight;
  const tw = Math.round(W * r), th = Math.round(H * r);
  if (cv.width !== tw || cv.height !== th) { cv.width = tw; cv.height = th; }
  const c = cv.getContext("2d");
  c.setTransform(r, 0, 0, r, 0, 0);
  c.clearRect(0, 0, W, H);
  return { c, W, H };
}
function nice(a, b, n) {
  const raw = (b - a) / n || 1, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const st = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(10));
  return out;
}
function fmtTick(v) {
  const a = Math.abs(v);
  if (a < 1e-12) return "0";
  if (a >= 10) return v.toFixed(0);
  if (a >= 1) return String(+v.toFixed(1));
  return String(+v.toFixed(3));
}
function frame(o, x0, x1, y0, y1, yt, xt) {
  const { c, W, H } = o, pw = W - PL - PR, ph = H - PT - PB;
  const X = x => PL + (x - x0) / (x1 - x0) * pw;
  const Y = v => PT + ph - (v - y0) / (y1 - y0) * ph;
  c.font = "11px system-ui, sans-serif";
  c.lineWidth = 1;
  yt.forEach(v => {
    const y = Math.round(Y(v)) + 0.5;
    c.strokeStyle = COL.grid; c.beginPath(); c.moveTo(PL, y); c.lineTo(W - PR, y); c.stroke();
    c.fillStyle = COL.faint; c.textAlign = "right"; c.fillText(fmtTick(v), PL - 6, y + 4);
  });
  c.textAlign = "center"; c.fillStyle = COL.faint;
  xt.forEach(([v, l]) => c.fillText(l, X(v), H - 6));
  if (y0 <= 0 && y1 >= 0) {
    const y = Math.round(Y(0)) + 0.5;
    c.strokeStyle = COL.axis; c.beginPath(); c.moveTo(PL, y); c.lineTo(W - PR, y); c.stroke();
  }
  return { X, Y, pw, ph, x0, x1, y0, y1, W, H };
}
function clipTo(c, F) { c.save(); c.beginPath(); c.rect(PL, PT - 1, F.pw, F.ph + 2); c.clip(); }
function hLine(c, F, v, color, dash, label, left) {
  const y = F.Y(v);
  c.save(); c.setLineDash(dash); c.strokeStyle = color; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(PL, y); c.lineTo(PL + F.pw, y); c.stroke(); c.restore();
  if (label) {
    c.font = "600 11px system-ui, sans-serif";
    const w = c.measureText(label).width, lx = left ? PL + 4 : PL + F.pw - 4 - w, ly = Math.max(PT + 12, y - 5);
    c.fillStyle = COL.panel; c.globalAlpha = 0.85; c.fillRect(lx - 3, ly - 10, w + 6, 14); c.globalAlpha = 1;
    c.fillStyle = color; c.textAlign = "left"; c.fillText(label, lx, ly);
  }
}
function vCursor(c, F, x) {
  if (x === null) return;
  const px = Math.round(F.X(x)) + 0.5;
  c.save(); c.strokeStyle = COL.axis; c.setLineDash([2, 3]); c.lineWidth = 1;
  c.beginPath(); c.moveTo(px, PT); c.lineTo(px, PT + F.ph); c.stroke(); c.restore();
}

const cv1 = $("c1"), cv2 = $("c2"), cv3 = $("c3");
let F1 = null, F2 = null;
let mode = "C";
let hoverX = null;
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

const C = { N: 4801, G0: -12, dx: 0.005, XL: -7, XR: 7, KH: 0.2, NK: 71, sig: 1, alp: 0, bw: 0.4, ymax: 0.6, IMIN: -2, IMAX: 12 };
const gx = new Float64Array(C.N), bg = new Float64Array(C.N), pg = new Float64Array(C.N);
for (let i = 0; i < C.N; i++) gx[i] = C.G0 + i * C.dx;
const KX = new Float64Array(C.NK), bK = new Float64Array(C.NK);
let Dk = new Float64Array(C.NK);
for (let k = 0; k < C.NK; k++) KX[k] = C.XL + k * C.KH;
const iL = Math.round((C.XL - C.G0) / C.dx), iR = Math.round((C.XR - C.G0) / C.dx);

function cBase() {
  let h = 0;
  for (let i = 0; i < C.N; i++) { const b = snPdf(gx[i], C.sig, C.alp); bg[i] = b; if (b > 0) h -= b * Math.log2(b) * C.dx; }
  for (let k = 0; k < C.NK; k++) bK[k] = snPdf(KX[k], C.sig, C.alp);
  C.H0 = h;
}
const dAt = k => (k < 0 || k >= C.NK) ? 0 : Dk[k];
function cInterp(x) {
  let i = Math.floor((x - C.XL) / C.KH);
  if (i >= C.NK - 1) i = C.NK - 2;
  const t = (x - KX[i]) / C.KH, P0 = dAt(i - 1), P1 = dAt(i), P2 = dAt(i + 1), P3 = dAt(i + 2);
  return 0.5 * (2 * P1 + (-P0 + P2) * t + (2 * P0 - 5 * P1 + 4 * P2 - P3) * t * t + (-P0 + 3 * P1 - 3 * P2 + P3) * t * t * t);
}
function cCompute() {
  let z = 0;
  for (let i = 0; i < C.N; i++) {
    let f = bg[i];
    if (i >= iL && i <= iR) f += cInterp(gx[i]);
    f = f > 0 ? f : 0;
    pg[i] = f; z += f * C.dx;
  }
  if (z < 1e-6) { Dk.fill(0); return cCompute(); }
  C.Z = z;
  let h = 0, m = 0, m2 = 0;
  for (let i = 0; i < C.N; i++) {
    const p = pg[i] / z; pg[i] = p;
    if (p > 0) h -= p * Math.log2(p) * C.dx;
    m += gx[i] * p * C.dx; m2 += gx[i] * gx[i] * p * C.dx;
  }
  const v = Math.max(m2 - m * m, 1e-12);
  C.H = h; C.SD = Math.sqrt(v); C.HG = 0.5 * Math.log2(2 * Math.PI * Math.E * v);
}
function cFit() {
  let mx = 0;
  for (let i = iL; i <= iR; i++) mx = Math.max(mx, pg[i], bg[i]);
  C.ymax = Math.max(0.3, mx * 1.25);
}

const Q = { n: 12, sig: 2.5, alp: 0, kind: "bell", p: [], ymax: 0.3, imax: 8 };
function qGen(kind) {
  if (kind) Q.kind = kind;
  const n = Q.n, c = (n - 1) / 2, w = [];
  for (let i = 0; i < n; i++) {
    if (Q.kind === "uniform") w.push(1);
    else if (Q.kind === "geometric") w.push(Math.pow(0.7, i));
    else if (Q.kind === "random") w.push(Math.pow(Math.random(), 2) + 0.02);
    else w.push(snPdf(i - c, Q.sig, Q.alp));
  }
  const s = w.reduce((a, b) => a + b, 0) || 1;
  Q.p = w.map(v => v / s);
  qCompute(); qFit();
}
function qCompute() {
  let h = 0, mx = 0;
  for (const p of Q.p) { if (p > 0) h -= p * Math.log2(p); mx = Math.max(mx, p); }
  Q.H = h; Q.maxp = mx;
}
function qFit() {
  const n = Q.n;
  Q.ymax = Math.max(Q.maxp * 1.25, 2 / n, 0.05);
  let imx = 0;
  for (const p of Q.p) if (p > 0) imx = Math.max(imx, -Math.log2(p));
  Q.imax = Math.min(30, Math.max(6, Math.ceil(imx) + 2, Math.ceil(Math.log2(n)) + 3));
}
function qSet(i, t) {
  const n = Q.n, p = Q.p;
  t = clamp(t, 0, 0.999);
  const Wo = 1 - p[i];
  if (Wo < 1e-12) { const share = (1 - t) / (n - 1); for (let j = 0; j < n; j++) p[j] = j === i ? t : share; }
  else { const s = (1 - t) / Wo; for (let j = 0; j < n; j++) p[j] = j === i ? t : p[j] * s; }
}

function draw() {
  if (mode === "C") drawC(); else drawD();
  updateStats();
}

function contPath(c, F, fn, lo, hi) {
  c.beginPath();
  let on = false;
  for (let i = iL; i <= iR; i += 2) {
    const v = fn(i);
    if (v === null || !isFinite(v)) { on = false; continue; }
    const y = F.Y(clamp(v, lo, hi));
    if (!on) { c.moveTo(F.X(gx[i]), y); on = true; } else c.lineTo(F.X(gx[i]), y);
  }
}

function drawC() {
  const xt = [-6, -4, -2, 0, 2, 4, 6].map(v => [v, String(v)]);
  let o = prep(cv1), c = o.c;
  const F = F1 = frame(o, C.XL, C.XR, 0, C.ymax, nice(0, C.ymax, 4), xt);
  clipTo(c, F);
  contPath(c, F, i => bg[i], -1, C.ymax * 2);
  c.setLineDash([5, 4]); c.strokeStyle = COL.ref; c.lineWidth = 1.5; c.stroke(); c.setLineDash([]);
  contPath(c, F, i => pg[i], -1, C.ymax * 2);
  c.lineTo(F.X(C.XR), F.Y(0)); c.lineTo(F.X(C.XL), F.Y(0)); c.closePath();
  c.fillStyle = COL["curve-fill"]; c.fill();
  contPath(c, F, i => pg[i], -1, C.ymax * 2);
  c.strokeStyle = COL.curve; c.lineWidth = 2.25; c.lineJoin = "round"; c.lineCap = "round"; c.stroke();
  c.globalAlpha = 0.55; c.fillStyle = COL.curve;
  for (let k = 0; k < C.NK; k++) {
    const i = Math.round((KX[k] - C.G0) / C.dx);
    c.beginPath(); c.arc(F.X(KX[k]), F.Y(Math.min(pg[i], C.ymax)), 1.8, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  vCursor(c, F, hoverX);
  c.restore();

  o = prep(cv2); c = o.c;
  const G = F2 = frame(o, C.XL, C.XR, C.IMIN, C.IMAX, [0, 4, 8, 12], xt);
  clipTo(c, G);
  contPath(c, G, i => bg[i] > 1e-14 ? -Math.log2(bg[i]) : null, C.IMIN - 1, C.IMAX + 1);
  c.setLineDash([5, 4]); c.strokeStyle = COL.ref; c.lineWidth = 1.5; c.stroke(); c.setLineDash([]);
  contPath(c, G, i => pg[i] > 1e-14 ? -Math.log2(pg[i]) : null, C.IMIN - 1, C.IMAX + 1);
  c.strokeStyle = COL.curve; c.lineWidth = 2.25; c.stroke();
  hLine(c, G, C.H, COL.mark, [6, 4], "H = " + C.H.toFixed(2));
  vCursor(c, G, hoverX);
  c.restore();

  let cmin = 0, cmax = 0.05;
  for (let i = iL; i <= iR; i++) { const p = pg[i]; if (p > 0) { const v = -p * Math.log2(p); if (v > cmax) cmax = v; if (v < cmin) cmin = v; } }
  cmax *= 1.15; cmin = cmin < 0 ? cmin * 1.15 : 0;
  o = prep(cv3); c = o.c;
  const K = frame(o, C.XL, C.XR, cmin, cmax, nice(cmin, cmax, 3), xt);
  clipTo(c, K);
  const cfn = i => { const p = pg[i]; return p > 0 ? -p * Math.log2(p) : 0; };
  const y0 = K.Y(0);
  const areaPath = () => { contPath(c, K, cfn, cmin, cmax); c.lineTo(K.X(C.XR), y0); c.lineTo(K.X(C.XL), y0); c.closePath(); };
  c.save(); c.beginPath(); c.rect(PL, PT, K.pw, y0 - PT); c.clip(); areaPath(); c.fillStyle = COL["curve-fill"]; c.fill(); c.restore();
  c.save(); c.beginPath(); c.rect(PL, y0, K.pw, K.ph + PT - y0); c.clip(); areaPath(); c.fillStyle = COL["neg-fill"]; c.fill(); c.restore();
  contPath(c, K, cfn, cmin, cmax); c.strokeStyle = COL.curve; c.lineWidth = 2; c.stroke();
  vCursor(c, K, hoverX);
  c.restore();
}

function barRect(c, x, w, y0, y1) {
  const top = Math.min(y0, y1), h = Math.abs(y1 - y0);
  if (h < 0.5) { c.fillRect(x, top, w, 1); return; }
  if (c.roundRect && w > 6) { const r = Math.min(3, h); c.beginPath(); c.roundRect(x, top, w, h, [r, r, 0, 0]); c.fill(); }
  else c.fillRect(x, top, w, h);
}
function drawD() {
  const n = Q.n, step = Math.max(1, Math.ceil(n / 12));
  const xt = [];
  for (let i = 0; i < n; i += step) xt.push([i, String(i + 1)]);
  const x0 = -0.5, x1 = n - 0.5;
  let o = prep(cv1), c = o.c;
  const F = F1 = frame(o, x0, x1, 0, Q.ymax, nice(0, Q.ymax, 4), xt);
  const bw = Math.max(2, F.pw / n * 0.72);
  clipTo(c, F);
  vCursor(c, F, hoverX === null ? null : clamp(Math.round(hoverX), 0, n - 1));
  c.fillStyle = COL.curve;
  for (let i = 0; i < n; i++) barRect(c, F.X(i) - bw / 2, bw, F.Y(0), F.Y(Math.min(Q.p[i], Q.ymax * 1.1)));
  hLine(c, F, 1 / n, COL.ref, [5, 4], "uniform 1/n", true);
  c.restore();

  o = prep(cv2); c = o.c;
  const G = F2 = frame(o, x0, x1, 0, Q.imax, nice(0, Q.imax, 4), xt);
  clipTo(c, G);
  vCursor(c, G, hoverX === null ? null : clamp(Math.round(hoverX), 0, n - 1));
  for (let i = 0; i < n; i++) {
    const p = Q.p[i];
    if (p > 0) { c.fillStyle = COL.curve; barRect(c, G.X(i) - bw / 2, bw, G.Y(0), G.Y(Math.min(-Math.log2(p), Q.imax * 1.1))); }
    else {
      c.fillStyle = COL["neg-fill"]; barRect(c, G.X(i) - bw / 2, bw, G.Y(0), G.Y(Q.imax * 1.1));
      c.fillStyle = COL.neg; c.font = "600 12px system-ui, sans-serif"; c.textAlign = "center"; c.fillText("∞", G.X(i), PT + 14);
    }
  }
  hLine(c, G, Math.log2(n), COL.ref, [5, 4], "max log₂ n", true);
  hLine(c, G, Q.H, COL.mark, [6, 4], "H = " + Q.H.toFixed(2));
  c.restore();

  const contrib = Q.p.map(p => p > 0 ? -p * Math.log2(p) : 0);
  const cmax = Math.max(0.05, Math.max(...contrib) * 1.2);
  o = prep(cv3); c = o.c;
  const K = frame(o, x0, x1, 0, cmax, nice(0, cmax, 3), xt);
  clipTo(c, K);
  c.fillStyle = COL.curve;
  for (let i = 0; i < n; i++) barRect(c, K.X(i) - bw / 2, bw, K.Y(0), K.Y(contrib[i]));
  c.restore();
}

function setStat(i, k, v) { $("k" + i).textContent = k; $("v" + i).textContent = v; }
function signed(v, d) { return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d); }
function updateStats() {
  if (mode === "C") {
    $("hVal").textContent = C.H.toFixed(3);
    $("hSub").textContent = signed(C.H - C.H0, 3) + " bits from the unsculpted start";
    setStat(1, "Negentropy J", Math.max(0, C.HG - C.H).toFixed(3) + " bits");
    setStat(2, "Gaussian bound", C.HG.toFixed(3) + " bits");
    setStat(3, "Std deviation", C.SD.toFixed(3));
    setStat(4, "Effective width", Math.pow(2, C.H).toFixed(3));
  } else {
    const mx = Math.log2(Q.n);
    $("hVal").textContent = Q.H.toFixed(3);
    $("hSub").textContent = "out of a possible " + mx.toFixed(3) + " bits for " + Q.n + " outcomes";
    setStat(1, "Redundancy", (mx - Q.H).toFixed(3) + " bits");
    setStat(2, "Efficiency H / log₂ n", (Q.H / mx * 100).toFixed(1) + "%");
    setStat(3, "Effective outcomes", Math.pow(2, Q.H).toFixed(2));
    setStat(4, "Min-entropy", (-Math.log2(Q.maxp)).toFixed(3) + " bits");
  }
}

function readout() {
  const r = $("read");
  if (hoverX === null) { r.textContent = ""; return; }
  if (mode === "C") {
    const i = clamp(Math.round((hoverX - C.G0) / C.dx), 0, C.N - 1), p = pg[i];
    r.textContent = "x " + hoverX.toFixed(2) + "   p " + p.toFixed(4) + "   I " + (p > 0 ? (-Math.log2(p)).toFixed(2) + " bits" : "∞");
  } else {
    const i = clamp(Math.round(hoverX), 0, Q.n - 1), p = Q.p[i];
    r.textContent = "outcome " + (i + 1) + "   p " + p.toFixed(4) + "   I " + (p > 0 ? (-Math.log2(p)).toFixed(2) + " bits" : "∞");
  }
}

const drag = { on: false, cv: null, anchor: -1, snap: null, last: -1, lastT: 0 };
function evToData(cv, e) {
  const F = cv === cv1 ? F1 : F2, r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const x = F.x0 + (px - PL) / F.pw * (F.x1 - F.x0);
  const v = F.y0 + (PT + F.ph - py) / F.ph * (F.y1 - F.y0);
  const t = cv === cv1 ? Math.max(0, v) : Math.pow(2, -clamp(v, F.y0, 60));
  return { x, t };
}
function cPull(kc, tp) {
  if (kc !== drag.anchor) { drag.anchor = kc; drag.snap = Dk.slice(); }
  const want = tp * C.Z - bK[kc], ch = want - drag.snap[kc];
  const bw = C.bw, reach = Math.ceil(4 * bw / C.KH) + 1;
  for (let k = Math.max(0, kc - reach); k <= Math.min(C.NK - 1, kc + reach); k++) {
    const d = KX[k] - KX[kc];
    Dk[k] = drag.snap[k] + Math.exp(-d * d / (2 * bw * bw)) * ch;
  }
}
function applyDrag(e) {
  const { x, t } = evToData(drag.cv, e);
  hoverX = x;
  if (mode === "C") {
    const kc = clamp(Math.round((x - C.XL) / C.KH), 0, C.NK - 1);
    if (drag.last >= 0 && Math.abs(kc - drag.last) > 1) {
      const dir = kc > drag.last ? 1 : -1;
      for (let k = drag.last + dir; k !== kc; k += dir) cPull(k, drag.lastT + (t - drag.lastT) * (k - drag.last) / (kc - drag.last));
    }
    cPull(kc, t);
    drag.last = kc; drag.lastT = t;
    cCompute();
  } else {
    const i = clamp(Math.round(x), 0, Q.n - 1);
    if (drag.last >= 0 && Math.abs(i - drag.last) > 1) {
      const dir = i > drag.last ? 1 : -1;
      for (let j = drag.last + dir; j !== i; j += dir) qSet(j, drag.lastT + (t - drag.lastT) * (j - drag.last) / (i - drag.last));
    }
    qSet(i, t);
    drag.last = i; drag.lastT = t;
    qCompute();
  }
  readout(); schedule();
}
[cv1, cv2].forEach(cv => {
  cv.addEventListener("pointerdown", e => {
    Object.assign(drag, { on: true, cv, anchor: -1, snap: null, last: -1 });
    cv.setPointerCapture(e.pointerId);
    applyDrag(e);
  });
  cv.addEventListener("pointermove", e => {
    if (drag.on) applyDrag(e);
    else { hoverX = evToData(cv, e).x; readout(); schedule(); }
  });
  const end = () => { drag.on = false; drag.anchor = -1; drag.last = -1; };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  cv.addEventListener("pointerleave", () => { if (!drag.on) { hoverX = null; readout(); schedule(); } });
});

function bindRange(id, fmt, fn) {
  const el = $(id), out = $(id + "O");
  el.addEventListener("input", () => { out.textContent = fmt(+el.value); fn(+el.value); });
}
bindRange("cSig", v => v.toFixed(2), v => { C.sig = v; cBase(); cCompute(); cFit(); schedule(); });
bindRange("cAlp", v => v.toFixed(1), v => { C.alp = v; cBase(); cCompute(); cFit(); schedule(); });
bindRange("cBw", v => v.toFixed(2), v => { C.bw = v; });
$("cClear").onclick = () => { Dk.fill(0); cCompute(); cFit(); schedule(); };
$("cFit").onclick = () => { cFit(); schedule(); };

bindRange("dN", v => String(v), v => { Q.n = v; qGen(); schedule(); });
bindRange("dSig", v => v.toFixed(1), v => { Q.sig = v; qGen("bell"); schedule(); });
bindRange("dAlp", v => v.toFixed(1), v => { Q.alp = v; qGen("bell"); schedule(); });
document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { qGen(b.dataset.kind); schedule(); });
$("dFit").onclick = () => { qFit(); schedule(); };

const NOTES = {
  C: "Gray dashed is the unsculpted start. Negentropy compares your shape to a Gaussian with the same variance, so it never drops below zero. Effective width is 2^H, the width of a uniform distribution carrying the same entropy. Differential entropy can go negative wherever p exceeds 1.",
  D: "Gray dashed is uniform, the maximum-entropy shape for n outcomes. Redundancy is log₂ n − H, which equals the KL divergence from uniform. Effective outcomes is 2^H, the number of equally likely outcomes with the same entropy. Min-entropy is the surprisal of the likeliest outcome and never exceeds H."
};
function setMode(m) {
  mode = m; hoverX = null;
  $("modeC").setAttribute("aria-pressed", m === "C");
  $("modeD").setAttribute("aria-pressed", m === "D");
  $("ctlC").classList.toggle("hidden", m !== "C");
  $("ctlD").classList.toggle("hidden", m !== "D");
  $("t1").textContent = m === "C" ? "p(x), drag to sculpt" : "pᵢ, drag the bars";
  $("notes").textContent = NOTES[m];
  readout(); schedule();
}
$("modeC").onclick = () => setMode("C");
$("modeD").onclick = () => setMode("D");

const mq = matchMedia("(prefers-color-scheme: dark)");
(mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(() => { readColors(); schedule(); });
new ResizeObserver(schedule).observe(document.querySelector("main"));

cBase(); cCompute(); cFit();
qGen("bell");
setMode("C");
})();
</script>
</body>
</html>
